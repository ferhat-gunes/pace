name: Source and user-flow checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:pwa
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/test-pwa-e2e.mjs
